<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy National Girlfriend Day ❤️</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle at top,#5b001f,#050005 60%);

color:white;

}



/* Background Lights */

.glow{

position:absolute;
width:350px;
height:350px;

background:#ff0077;

filter:blur(150px);

opacity:.35;

animation:moveGlow 8s infinite alternate;

}


@keyframes moveGlow{

from{
transform:translate(-150px,-100px);
}

to{
transform:translate(150px,150px);
}

}



/* Main Card */

.card{

width:92%;
max-width:400px;

padding:35px 25px;

background:

rgba(255,255,255,.08);

border:

1px solid rgba(255,255,255,.2);

backdrop-filter:blur(25px);

border-radius:35px;

box-shadow:

0 30px 80px rgba(0,0,0,.7),
0 0 40px rgba(255,0,120,.3);

text-align:center;

z-index:2;

animation:

cardOpen 1s;

}


@keyframes cardOpen{

from{

opacity:0;

transform:scale(.5) rotateX(90deg);

}

to{

opacity:1;

transform:scale(1);

}

}



h1{

font-size:26px;

margin:15px 0;

}


p{

font-size:15px;

line-height:1.6;

opacity:.9;

}




/* Password */


.lock{

font-size:70px;

animation:

lockFloat 2s infinite;

filter:

drop-shadow(0 0 20px pink);

}


@keyframes lockFloat{

50%{

transform:translateY(-15px);

}

}



input{

width:100%;

padding:15px;

margin-top:25px;

border-radius:50px;

border:none;

outline:none;

text-align:center;

font-size:16px;

}



button{

padding:14px 28px;

margin-top:20px;

border:none;

border-radius:50px;

background:white;

color:#ff0066;

font-weight:bold;

font-size:15px;

box-shadow:

0 0 25px rgba(255,255,255,.5);

transition:.3s;

}


button:active{

transform:scale(.9);

}



/* Hide */


.hidden{

display:none;

}



/* Shake Wrong Password */


.shake{

animation:shake .4s;

}


@keyframes shake{

25%{
transform:translateX(-15px);
}

50%{
transform:translateX(15px);
}

75%{
transform:translateX(-15px);
}

}




/* Floating Effects */


.effect{

position:absolute;

pointer-events:none;

animation:float 5s linear forwards;

z-index:5;

}


@keyframes float{

0%{

transform:translateY(100vh) scale(.5);

opacity:0;

}


50%{

opacity:1;

}


100%{

transform:translateY(-20vh) scale(1.5);

opacity:0;

}

}




/* Dice */

.dice{

width:100px;

height:100px;

margin:30px auto;

background:white;

color:#ff0066;

display:flex;

align-items:center;

justify-content:center;

font-size:50px;

border-radius:20px;

box-shadow:

0 20px 50px black;

}


.roll{

animation:diceSpin 2s;

}



@keyframes diceSpin{

0%{

transform:rotateX(0) rotateY(0);

}

100%{

transform:

rotateX(1080deg)

rotateY(1080deg);

}

}

/* PREMIUM LETTER */

.envelope{
font-size:90px;
margin:30px;
animation:envelopeFloat 2s infinite;
filter:drop-shadow(0 0 25px pink);
}

@keyframes envelopeFloat{

50%{
transform:translateY(-15px) rotate(5deg);
}

}


.letter{

background:#fff8e8;

color:#333;

padding:25px;

border-radius:15px;

box-shadow:
0 30px 70px rgba(0,0,0,.6);

animation:letterOpen 2s;

}



@keyframes letterOpen{

from{

opacity:0;

transform:

rotateX(90deg)

translateY(80px);

}


to{

opacity:1;

transform:

rotateX(0);

}

}




/* FIREWORKS */

.firework{

position:absolute;

font-size:35px;

animation:explode 2s forwards;

z-index:10;

}


@keyframes explode{


0%{

transform:scale(.2);

opacity:0;

}


40%{

opacity:1;

}


100%{

transform:

translate(var(--x),var(--y))

scale(2);

opacity:0;

}

}




/* FINAL HEART */


.bigHeart{

font-size:120px;

animation:heartbeat 1s infinite;

filter:

drop-shadow(0 0 40px #ff0080);

}


@keyframes heartbeat{


50%{

transform:scale(1.3);

}

}



/* MUSIC BUTTON */

.musicBtn{

position:fixed;

top:20px;

right:20px;

z-index:20;

padding:10px 18px;

}

</style>

</head>


<body>


<div class="glow"></div>


<div class="card" id="card">



<!-- PASSWORD SCREEN -->


<div id="passwordPage">


<div class="lock">

🔒

</div>


<h1>

A Special Surprise Awaits You ❤️

</h1>


<p>

Enter the secret password to unlock your surprise

</p>


<input

id="password"

placeholder="Secret Password">


<button onclick="checkPassword()">

Unlock ❤️

</button>


<p id="error"></p>


</div>





<!-- FIRST DICE -->


<div id="dicePage" class="hidden">


<h1>

Roll The Lucky Dice ❤️

</h1>


<div id="dice" class="dice">

?

</div>


<button onclick="rollFirstDice()">

Roll Dice 🎲

</button>


</div>




<!-- LOVE QUESTION -->


<div id="lovePage" class="hidden">


<h1>

Do You Love Me, Babyyy? ❤️

</h1>


<p>

Choose carefully 🥺💕

</p>


<button onclick="loveYes()">

❤️ Yes, Of Course

</button>


<button id="noBtn" onclick="loveNo()">

💔 No

</button>


<div id="cuteReply"></div>


</div>



</div>


<script>


function createEffects(){

let items=[

"❤️",

"✨",

"🌹",

"💖"

];


for(let i=0;i<40;i++){

let e=document.createElement("div");

e.className="effect";

e.innerHTML=

items[Math.floor(Math.random()*items.length)];


e.style.left=Math.random()*100+"%";

e.style.fontSize=

20+Math.random()*25+"px";


document.body.appendChild(e);


setTimeout(()=>{

e.remove();

},5000);


}

}





function checkPassword(){


let pass=

document.getElementById("password").value;


if(pass.toLowerCase()=="shubhi"){


createEffects();


passwordPage.classList.add("hidden");


setTimeout(()=>{


dicePage.classList.remove("hidden");


},1200);



}

else{


card.classList.add("shake");


error.innerHTML=

"Oops... That's not the secret password ❤️";


setTimeout(()=>{

card.classList.remove("shake");

},500);


}

}



function rollFirstDice(){


dice.classList.add("roll");


setTimeout(()=>{


dice.innerHTML="⚅";


createEffects();


setTimeout(()=>{


dicePage.classList.add("hidden");


lovePage.classList.remove("hidden");


},2500);


},2000);


}


// LOVE QUESTION

let noClicks = 0;


function loveNo(){

let btn = document.getElementById("noBtn");

let reply = document.getElementById("cuteReply");


noClicks++;


if(noClicks <= 5){

btn.style.position="absolute";

btn.style.left = Math.random()*180 + "px";

btn.style.top = Math.random()*120 + "px";


let texts=[

"Aww... Are You Really Sure? 🥺❤️",

"Think again babyyy 😭💗",

"That button is running away 😂❤️",

"My heart says try YES 🥹",

"Okay okay, I know you will choose YES 💖"

];


reply.innerHTML=texts[noClicks-1];


}

else{


btn.style.position="relative";

btn.innerHTML="Okay ❤️";

reply.innerHTML=

"Now choose the cute option 🥰";


}

}




function loveYes(){


createEffects();


lovePage.classList.add("hidden");


setTimeout(()=>{


document.getElementById("card").innerHTML=`

<h1>
🎲 Lucky Love Dice
</h1>

<p>
Roll again to unlock your special surprise ❤️
</p>


<div id="dice2" class="dice">

?

</div>


<button onclick="rollSecondDice()">

Roll Dice ✨

</button>


`;


},1000);



}




function rollSecondDice(){


let d=document.getElementById("dice2");


d.classList.add("roll");



setTimeout(()=>{


d.innerHTML="⚀";


createEffects();



setTimeout(()=>{


showGift();


},1500);



},2000);



}




function showGift(){


document.getElementById("card").innerHTML=`

<h1>

🎁 Congratulations ❤️

</h1>


<p>

You unlocked a special love letter 💌

</p>


<div class="envelope">

💌

</div>


<button onclick="openLetter()">

Open Letter ❤️

</button>


`;



createEffects();


}




function openLetter(){


document.getElementById("card").innerHTML=`

<div class="letter">


<h1>

Happy National Girlfriend Day ❤️

</h1>


<p id="typeText"></p>


</div>


`;


let text=

"Babyyy ❤️ Ever since we started talking on 7 April, my life has become so much happier. You are my favourite reason to smile every day. I loveee youu so much Babyyy ❤️";


let i=0;


let timer=setInterval(()=>{


document.getElementById("typeText").innerHTML += text[i];


i++;


if(i>=text.length){


clearInterval(timer);


setTimeout(()=>{


finalCelebration();


},2500);



}


},60);



}
// FINAL CELEBRATION


function finalCelebration(){


document.getElementById("card").innerHTML=`

<h1>

❤️ HAPPY NATIONAL GIRLFRIEND'S DAY BABYYY ❤️

</h1>


<p>

You are my favorite person,
my happiness,
and my forever. ❤️

</p>


<p>

I Love You So Much, Babyyy ❤️

</p>


<div class="bigHeart">

❤️

</div>


`;


startCelebration();


}





function startCelebration(){


fireworks();


setInterval(()=>{


createEffects();


},500);



}





function fireworks(){


for(let i=0;i<80;i++){


let f=document.createElement("div");


f.className="firework";


f.innerHTML=

["🎆","✨","❤️","💖"][

Math.floor(Math.random()*4)

];



f.style.left="50%";

f.style.top="50%";


f.style.setProperty(

"--x",

(Math.random()*500-250)+"px"

);


f.style.setProperty(

"--y",

(Math.random()*500-250)+"px"

);



document.body.appendChild(f);



setTimeout(()=>{

f.remove();

},2000);



}


}






// MUSIC SYSTEM


let music=new Audio();


music.loop=true;


// Browser permission ke liye button se start hoga


function musicOn(){


music.play();


}
</script>


</body>
</html>
